<html>
  <head>
    <title>BIG test Hello</title>
    <script>
      function hello(name) {
        console.log("In script 1");
        const screen = document.getElementById("screen");
        const h1 = document.createElement("h1");
        h1.innerHTML = "Hello, " + name + "!";
        screen.appendChild(h1);
      }
    </script>
  </head>
  <body id="screen">
    <h1 style="align-self: center">TEST Web Server</h1>
    <img src="https://api.weather.gov/icons/land/day/tsra,60?size=large" />
    <script>
      console.log("In script 2");
      var screen = document.getElementById("screen");
      var h2 = document.createElement("h2");
      h2.innerHTML = "Hello, world!";
      screen.appendChild(h2);
      hello("JIM");
      hello("JEN");
      hello("Sally");
    </script>
  </body>
</html>
